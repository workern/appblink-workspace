org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# --- Build speed optimizations ---
# Run independent subprojects (:app and Flutter plugins) in parallel
org.gradle.parallel=true
# Cache task outputs locally — reuse unchanged results on incremental builds (same as ccache for iOS)
org.gradle.caching=true
# Compile only changed Kotlin/Java source files (same as SWIFT_COMPILATION_MODE=incremental)
kotlin.incremental=true
# Each module only sees its own R class entries — faster R generation and avoids
# recompiling downstream modules when unrelated resources change in a dependency
android.nonTransitiveRClass=true
