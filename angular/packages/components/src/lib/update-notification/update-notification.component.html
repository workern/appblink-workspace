@if (versionService.updateAvailable()) {
  <div
    role="alert"
    aria-live="polite"
    aria-labelledby="update-title"
    class="fixed bottom-6 left-4 right-4 sm:left-auto sm:right-6 sm:w-96 z-[100] animate-slide-up"
  >
    <!-- Glassmorphic card with theme gradient -->
    <div
      class="relative overflow-hidden rounded-2xl shadow-2xl backdrop-blur-xl bg-white/95 dark:bg-gray-900/95 border border-white/20 dark:border-gray-700/50"
    >
      <!-- Gradient accent bar using CSS variable --primary -->
      <div
        class="absolute top-0 left-0 right-0 h-1 opacity-90 bg-primary-gradient"
      ></div>

      <!-- Content -->
      <div class="p-5">
        <div class="flex items-start gap-4">
          <!-- Icon with gradient background -->
          <div
            class="flex-shrink-0 w-12 h-12 rounded-xl flex items-center justify-center shadow-lg relative overflow-hidden group bg-primary-gradient"
          >
            <div
              class="absolute inset-0 bg-white/20 group-hover:bg-white/30 transition-colors"
            ></div>
            <ng-icon
              hlm
              name="lucideSparkles"
              class="text-white relative z-10 animate-pulse-subtle"
              size="base"
            ></ng-icon>
          </div>

          <!-- Text content -->
          <div class="flex-1 min-w-0">
            <div class="flex items-start justify-between gap-2 mb-1">
              <h3
                id="update-title"
                class="text-base font-semibold text-gray-900 dark:text-white leading-tight"
              >
                ✨ New Version Available
              </h3>
              <button
                hlmBtn
                variant="ghost"
                size="icon"
                (click)="dismissUpdate()"
                class="h-6 w-6 -mt-1 -mr-1 text-gray-400 hover:text-gray-600 dark:hover:text-gray-200 transition-colors"
                aria-label="Dismiss notification"
              >
                <ng-icon hlm name="lucideX" size="sm"></ng-icon>
              </button>
            </div>

            <p
              class="text-sm text-gray-600 dark:text-gray-300 mb-4 leading-relaxed"
            >
              A new version of
              <strong class="font-semibold text-primary-color">{{
                appName()
              }}</strong>
              is ready with improvements and bug fixes.
            </p>

            <!-- Action buttons -->
            <div class="flex items-center gap-2">
              <button
                hlmBtn
                size="sm"
                (click)="updateNow()"
                class="relative overflow-hidden group shadow-md hover:shadow-lg transition-all bg-primary-gradient text-white border-0"
                aria-label="Update now"
              >
                <span class="relative z-10 flex items-center gap-1.5">
                  <ng-icon hlm name="lucideDownload" size="sm" />
                  <span class="font-medium">Update Now</span>
                </span>
                <div
                  class="absolute inset-0 bg-white/0 group-hover:bg-white/20 transition-colors"
                ></div>
              </button>

              <button
                hlmBtn
                variant="ghost"
                size="sm"
                (click)="dismissUpdate()"
                class="text-gray-600 dark:text-gray-300 hover:text-gray-900 dark:hover:text-white transition-colors"
                aria-label="Update later"
              >
                <span class="font-medium">Later</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
}
