<hlm-sheet
  [state]="showInviteSheet() ? 'open' : 'closed'"
  side="right"
  (stateChanged)="onSheetStateChanged($event)"
>
  <hlm-sheet-content *hlmSheetPortal>
    <div hlmSheetHeader>
      <h3 hlmSheetTitle>Invite a member</h3>
      <p hlmSheetDescription>
        Enter the email address of the person you'd like to invite.
      </p>
    </div>

    <div class="invite-form">
      <div class="form-field">
        <label hlmLabel for="invite-email">Email address</label>
        <input
          hlmInput
          id="invite-email"
          type="email"
          placeholder="colleague@example.com"
          [ngModel]="inviteEmail()"
          (ngModelChange)="inviteEmail.set($event)"
          class="w-full"
        />
      </div>

      <div class="form-field">
        <label hlmLabel for="invite-role">Role</label>
        <brn-select
          id="invite-role"
          [ngModel]="inviteRole()"
          (ngModelChange)="inviteRole.set($event)"
        >
          <hlm-select-trigger class="w-full">
            <hlm-select-value />
          </hlm-select-trigger>
          <hlm-select-content>
            <hlm-option value="member">Member</hlm-option>
            <hlm-option value="owner">Owner</hlm-option>
          </hlm-select-content>
        </brn-select>
      </div>
    </div>

    <div hlmSheetFooter>
      <button hlmBtn variant="outline" (click)="showInviteSheet.set(false)">
        Cancel
      </button>
      <button
        hlmBtn
        [disabled]="!inviteEmail().trim() || isInviting()"
        (click)="submitInvite()"
      >
        {{ isInviting() ? 'Sending…' : 'Send invite' }}
      </button>
    </div>
  </hlm-sheet-content>
</hlm-sheet>
