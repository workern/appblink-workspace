name: workern_auth
description: 'A reusable authentication package for Workern Flutter applications with Firebase support.'
publish_to: 'none'
resolution: workspace

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # Common Models
  workern_models:
    path: ../workern_models

  # UI Widgets
  workern_widgets:
    path: ../workern_widgets
  workern_services:
    path: ../workern_services

  # Firebase
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  firebase_ui_auth: ^3.0.1
  firebase_ui_oauth_google: ^2.0.1
  firebase_ui_oauth_apple: ^2.0.1
  sign_in_with_apple: ^6.1.4

  # State Management
  flutter_riverpod: ^3.1.0

  # Routing
  go_router: ^14.0.0

  # UI & Image handling
  cached_network_image: ^3.4.1
  shadcn_ui: ^0.50.2

  # OTP input (single hidden TextField — no keyboard flicker)
  pinput: ^6.0.2

  # Utilities
  url_launcher: ^6.3.1
  intl: ^0.20.2
  uuid: ^4.5.1
  equatable: ^2.0.5
  sms_autofill: ^2.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
