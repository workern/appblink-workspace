<div class="legal-page" [style.--legal-top-offset.px]="topOffset()">
  @if (!hideBuiltInHeader()) {
    <header class="legal-page-header">
      <div class="legal-header-inner">
        <button class="legal-back-btn" (click)="backClick.emit()">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            aria-hidden="true"
          >
            <path d="M19 12H5M12 5l-7 7 7 7" />
          </svg>
          Back to Home
        </button>
        @if (appName()) {
          <span class="legal-app-label">{{ appName() }}</span>
        }
      </div>
    </header>
  }

  <div class="legal-layout">
    <!-- Sidebar TOC -->
    <aside class="legal-toc" aria-label="Table of contents">
      <div class="legal-toc-inner">
        <p class="legal-toc-heading">Contents</p>
        <nav>
          <ol class="legal-toc-list">
            @for (section of config().tocSections; track section.id) {
              <li>
                <a
                  (click)="scrollToSection(section.id)"
                  role="button"
                  tabindex="0"
                >
                  {{ section.label }}
                </a>
              </li>
            }
          </ol>
        </nav>
      </div>
    </aside>

    <!-- Main Content -->
    <main class="legal-content">
      <div class="legal-content-hero">
        <h1>{{ config().title }}</h1>
        <p class="legal-last-updated">
          Last Updated:
          <time [attr.datetime]="config().lastUpdated">{{
            config().lastUpdatedDisplay
          }}</time>
        </p>
        <p class="legal-intro-text">{{ config().introText }}</p>
      </div>

      <ng-content></ng-content>
    </main>
  </div>
</div>
