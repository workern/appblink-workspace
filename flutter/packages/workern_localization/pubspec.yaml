name: workern_localization
description: Shared localization setup for Workern apps — supported locales, delegates, and context extension.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.10.3

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: '>=0.19.0 <1.0.0'
  flutter_riverpod: ^3.1.0
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  generate: true
