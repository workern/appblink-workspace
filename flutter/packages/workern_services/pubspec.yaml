name: workern_services
description: Cloud functions and other services for Workern apps.
publish_to: none

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  firebase_storage: ^13.0.6
  firebase_analytics: ^12.3.0
  firebase_app_check: ^0.4.1+4
  cloud_firestore: ^6.1.2
  cloud_functions: ^6.0.6
  firebase_messaging: ^16.1.1
  firebase_remote_config: ^6.1.4
  workern_auth:
    path: ../workern_auth
  workern_models:
    path: ../workern_models
  flutter_sharing_intent: ^2.0.4
  flutter_riverpod: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
