name: workern_ai
description: Unified AI services package for Workern apps supporting text and image generation with Firebase AI (Gemini models)
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase AI
  firebase_ai: ^3.6.0
  firebase_core: ^4.4.0

  # HTTP for fallback/external services
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
