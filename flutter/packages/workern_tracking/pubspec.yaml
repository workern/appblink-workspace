name: workern_tracking
description: App Tracking Transparency (ATT) consent service for iOS. Requires NSUserTrackingUsageDescription in Info.plist. Import only when your app uses ad tracking.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # ATT — requires NSUserTrackingUsageDescription in Info.plist
  app_tracking_transparency: ^2.0.6+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
