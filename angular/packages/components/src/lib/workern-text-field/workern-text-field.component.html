<div class="flex flex-col gap-1.5 w-full" [style.--primary]="primaryColor()">
  @if (label()) {
    <label hlmLabel [for]="id()">
      {{ label() }}
      @if (descriptor()?.required) {
        <span class="text-destructive ml-0.5">*</span>
      }
    </label>
  }
  <input
    hlmInput
    [id]="id()"
    [type]="type()"
    [placeholder]="hint()"
    [formField]="formField()"
    [error]="error() ? true : 'auto'"
    class="w-full"
  />
  @if (error()) {
    <p class="text-sm text-destructive flex items-center gap-1">
      <svg
        class="w-4 h-4 flex-shrink-0"
        fill="currentColor"
        viewBox="0 0 20 20"
      >
        <path
          fill-rule="evenodd"
          d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
          clip-rule="evenodd"
        />
      </svg>
      <span>{{ error() }}</span>
    </p>
  }
  @if (hint() && !error()) {
    <p class="text-xs text-muted-foreground mt-0.5">{{ hint() }}</p>
  }
</div>
