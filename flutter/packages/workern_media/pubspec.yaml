name: workern_media
description: Media widgets and services (image upload, video player, storage) that require camera/photo library permissions. Import only when your app uses these features.
version: 1.0.0
publish_to: 'none'

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # Shared models and data structures
  workern_models:
    path: ../workern_models

  # Core services (for FirebaseUsageTracker)
  workern_services:
    path: ../workern_services

  # State management (for providers)
  flutter_riverpod: ^3.1.0

  # Image picker — requires NSPhotoLibraryUsageDescription + NSCameraUsageDescription
  image_picker: ^1.1.2

  # Firebase Storage for file uploads
  firebase_storage: ^13.0.6

  # Image + video compression — requires NSPhotoLibraryUsageDescription
  flutter_image_compress: ^2.3.0
  video_compress: ^3.1.3
  path: ^1.9.0

  # Video player
  video_player: ^2.10.1
  chewie: ^1.13.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
