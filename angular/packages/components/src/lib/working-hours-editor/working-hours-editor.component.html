<div class="rounded-lg border border-gray-200 overflow-hidden">
  <!-- Header -->
  <div
    class="grid grid-cols-[64px_1fr_1fr_56px] gap-2 bg-gray-50 px-3 py-2 text-xs font-medium text-gray-500 uppercase tracking-wide"
  >
    <span>Day</span>
    <span>Opens</span>
    <span>Closes</span>
    <span class="text-center">Closed</span>
  </div>

  @for (row of rows(); track row.key) {
    <div
      class="grid grid-cols-[64px_1fr_1fr_56px] gap-2 items-center px-3 py-2.5 border-t border-gray-100"
      [class.opacity-50]="row.day.closed"
    >
      <!-- Day label -->
      <span class="text-sm font-medium text-gray-700">{{ row.label }}</span>

      <!-- Open time -->
      <input
        type="time"
        [value]="row.day.openTime"
        [disabled]="row.day.closed"
        (change)="setOpenTime(row.key, $event)"
        class="w-full rounded-md border border-gray-300 px-2 py-1.5 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500 disabled:cursor-not-allowed disabled:bg-gray-50"
      />

      <!-- Close time -->
      <input
        type="time"
        [value]="row.day.closeTime"
        [disabled]="row.day.closed"
        (change)="setCloseTime(row.key, $event)"
        class="w-full rounded-md border border-gray-300 px-2 py-1.5 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500 disabled:cursor-not-allowed disabled:bg-gray-50"
      />

      <!-- Closed toggle -->
      <div class="flex justify-center">
        <input
          type="checkbox"
          [checked]="row.day.closed"
          (change)="toggleClosed(row.key, $event)"
          class="h-4 w-4 cursor-pointer rounded border-gray-300 text-blue-600 focus:ring-blue-500"
          [attr.aria-label]="row.label + ' closed'"
        />
      </div>
    </div>
  }
</div>
