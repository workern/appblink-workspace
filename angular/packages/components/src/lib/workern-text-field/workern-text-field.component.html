<div class="flex flex-col gap-1.5 w-full">
  @if (label()) {
    <label [for]="id()" class="text-sm font-semibold text-gray-900 mb-0.5">
      {{ label() }}
      @if (descriptor()!.required) {
        <span class="text-red-500 ml-0.5">*</span>
      }
    </label>
  }
  <input
    [id]="id()"
    [type]="type()"
    [placeholder]="hint()"
    [formField]="formField()"
    class="w-full px-4 py-3 text-base font-normal text-gray-900 bg-white border-2 rounded-xl shadow-sm placeholder:text-gray-400 transition-all duration-200 ease-in-out focus:outline-none focus:ring-4 hover:border-gray-400 disabled:bg-gray-100 disabled:text-gray-500 disabled:cursor-not-allowed disabled:border-gray-200"
    [class.border-gray-300]="!error()"
    [class.hover:shadow-md]="!error() && enabled()"
    [class.focus:shadow-lg]="!error()"
    [class.border-red-400]="error()"
    [class.focus:border-red-500]="error()"
    [style.--primary]="primaryColor()"
  />
  @if (error()) {
    <p class="text-sm text-red-600 font-medium mt-0.5 flex items-center gap-1">
      <svg
        class="w-4 h-4 flex-shrink-0"
        fill="currentColor"
        viewBox="0 0 20 20"
      >
        <path
          fill-rule="evenodd"
          d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z"
          clip-rule="evenodd"
        />
      </svg>
      <span>{{ error() }}</span>
    </p>
  }
  @if (hint() && !error()) {
    <p class="text-xs text-gray-500 mt-0.5">{{ hint() }}</p>
  }
</div>
