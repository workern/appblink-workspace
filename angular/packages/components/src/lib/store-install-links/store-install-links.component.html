@if (hasAnyStoreLink()) {
  <section
    class="rounded-xl border border-border bg-card p-4 text-card-foreground"
    role="region"
    aria-label="Install app links"
  >
    <div class="space-y-3">
      <div class="space-y-1">
        <h3 class="text-base font-semibold">{{ title() }}</h3>
        @if (description()) {
          <p class="text-sm text-muted-foreground">{{ description() }}</p>
        }
      </div>

      <div class="flex flex-col gap-2 sm:flex-row">
        @if (playStoreUrl()) {
          <a
            class="inline-flex min-h-11 items-center gap-2 rounded-md border border-border px-4 py-2 text-sm font-medium transition-colors hover:bg-accent hover:text-accent-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"
            [attr.href]="playStoreUrl()"
            target="_blank"
            rel="noopener noreferrer"
            [attr.aria-label]="
              'Install ' + appName() + ' from Google Play Store'
            "
          >
            <svg
              class="h-5 w-5"
              viewBox="0 0 24 24"
              fill="currentColor"
              aria-hidden="true"
            >
              <path
                d="M3 3.8v16.4c0 .7.8 1.1 1.4.7l9.6-8.2-9.6-8.2c-.6-.4-1.4 0-1.4.7Z"
              />
              <path
                d="m14 12 2.8-2.4 3.5 1.9c.9.5.9 1.7 0 2.2l-3.5 1.9L14 12Z"
              />
            </svg>
            <span>Google Play</span>
          </a>
        }

        @if (appStoreUrl()) {
          <a
            class="inline-flex min-h-11 items-center gap-2 rounded-md border border-border px-4 py-2 text-sm font-medium transition-colors hover:bg-accent hover:text-accent-foreground focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-ring"
            [attr.href]="appStoreUrl()"
            target="_blank"
            rel="noopener noreferrer"
            [attr.aria-label]="'Install ' + appName() + ' from Apple App Store'"
          >
            <svg
              class="h-5 w-5"
              viewBox="0 0 24 24"
              fill="currentColor"
              aria-hidden="true"
            >
              <path
                d="M16.8 12.4c0-2 1.7-3 1.8-3.1-1-1.5-2.5-1.7-3-1.7-1.3-.1-2.5.8-3.1.8-.6 0-1.6-.8-2.6-.8-1.3 0-2.5.8-3.2 2-.9 1.6-.2 4 .6 5.2.4.6 1 1.4 1.8 1.4.7 0 1-.4 1.9-.4.9 0 1.2.4 1.9.4.8 0 1.3-.7 1.8-1.3.5-.7.7-1.4.7-1.4-.1 0-1.6-.6-1.6-2.1Zm-2-6.2c.3-.4.6-1 .5-1.6-.5 0-1.2.4-1.6.8-.3.4-.6 1-.5 1.6.6.1 1.3-.3 1.6-.8Z"
              />
              <path d="M9.2 19.5h5.6a.8.8 0 1 1 0 1.6H9.2a.8.8 0 1 1 0-1.6Z" />
            </svg>
            <span>App Store</span>
          </a>
        }
      </div>
    </div>
  </section>
}
